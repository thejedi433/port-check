[project]
name = "port-check"
version = "0.1.0"
description = "Check if a port is open on a host"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
port-check = "port_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
